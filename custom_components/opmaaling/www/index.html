<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vinduesopmåling</title>
<style>
  :root {
    --blue: #1f5fa8; --blue-d: #174a84; --bg: #f2f4f7; --card: #fff; --text: #1b1f24;
    --muted: #6b7280; --line: #e3e6eb; --red: #c0392b; --green: #1e8e5a;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--blue); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px; display: flex; align-items: center; gap: 8px; min-height: 56px; }
  header h1 { font-size: 19px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 10px;
    padding: 8px 12px; font-size: 16px; }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 15px; }
  .title { font-weight: 600; }
  .clickable { cursor: pointer; }
  .clickable:active { background: #eef3fa; }
  .thumb { width: 78px; height: 78px; object-fit: contain; border-radius: 8px; background: #fff;
    border: 1px solid var(--line); flex: none; }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
    background: #e6eef8; color: var(--blue-d); }
  .tag.glas { background: #e5f5ee; color: #17694a; }
  .summary { display: flex; gap: 10px; margin-bottom: 10px; }
  .summary .card { flex: 1; text-align: center; margin: 0; }
  .summary b { display: block; font-size: 26px; color: var(--blue); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 17px;
    font-weight: 600; background: var(--blue); color: #fff; }
  .btn:active { background: var(--blue-d); }
  .btn.sec { background: #e6eef8; color: var(--blue-d); }
  .btn.danger { background: #fbeaea; color: var(--red); }
  .btn.small { padding: 10px; font-size: 15px; }
  .btns { display: flex; gap: 8px; margin: 8px 0; }
  .btns .btn { flex: 1; }
  .fab { position: fixed; left: 12px; right: 12px; width: auto; bottom: calc(14px + env(safe-area-inset-bottom));
    max-width: 696px; margin: 0 auto; z-index: 6; box-shadow: 0 4px 14px rgba(31,95,168,.35); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  label.f { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=number], input[inputmode], textarea {
    width: 100%; font-size: 18px; padding: 12px; border: 1px solid #cfd5dd; border-radius: 10px; background: #fff;
    font-family: inherit; color: var(--text); }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--blue); border-color: transparent; }
  .mm { position: relative; }
  .mm span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .two { display: flex; gap: 10px; }
  .two > div { flex: 1; }
  .seg { display: flex; background: #e8ebf0; border-radius: 11px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 10px; font-size: 16px; border-radius: 9px; color: var(--text); }
  .seg button.on { background: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .stepper { display: flex; align-items: center; gap: 0; }
  .stepper button { width: 52px; height: 50px; font-size: 24px; border: 1px solid #cfd5dd; background: #fff; color: var(--blue); }
  .stepper button:first-child { border-radius: 10px 0 0 10px; }
  .stepper button:last-child { border-radius: 0 10px 10px 0; }
  .check { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #cfd5dd; border-radius: 10px;
    padding: 12px 14px; margin-top: 12px; font-size: 18px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .check input { width: 26px; height: 26px; margin: 0; accent-color: var(--blue); }
  .tag.ventil { background: #fdeee2; color: #9a4b0c; }
  .tag.raa { background: #ece8fb; color: #4c3a99; }
  .check.small { font-size: 15px; padding: 9px 12px; margin-top: 8px; }
  .check.small input { width: 22px; height: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 8px; }
  .chip { border: 1px solid #cfd5dd; background: #fff; color: var(--text); border-radius: 99px; padding: 10px 16px; font-size: 16px; }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .raasel { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #cfd5dd; border-radius: 10px;
    padding: 8px 12px; margin-top: 8px; cursor: pointer; min-height: 56px; }
  .raasel img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex: none; }
  .raasel .nm { flex: 1; font-weight: 600; }
  .raasel .chg { color: var(--blue); font-size: 15px; }
  .raasel.empty { justify-content: center; color: var(--blue); font-weight: 600; font-size: 17px; background: #e6eef8; border-color: transparent; }
  .raagrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .raatile { background: #fff; border: 2px solid #dfe3e8; border-radius: 12px; padding: 5px; text-align: center; cursor: pointer;
    font-size: 12.5px; line-height: 1.2; color: var(--text); display: flex; flex-direction: column; gap: 4px; }
  .raatile.on { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(31,95,168,.25); background: #eef4fb; font-weight: 600; }
  .raatile .ph { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: repeating-linear-gradient(45deg, #e9eef4 0 6px, #f6f8fb 6px 12px);
    display: flex; align-items: center; justify-content: center; color: #9aa4b2; font-size: 22px; }
  .raatile .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stepper input { border-radius: 0; text-align: center; border-left: 0; border-right: 0; height: 50px; }
  .sketch { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: block; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 94vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 14px 14px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .sheet h2 { margin: 2px 0 6px; font-size: 20px; }
  .sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: -14px;
    background: var(--bg); padding: 4px 0 8px; z-index: 2; }
  .sheet-top button { border: 0; background: none; font-size: 17px; color: var(--blue); padding: 8px 4px; }
  .sheet-top button.save { font-weight: 700; }
  .dialog-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .dialog { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 380px; }
  .dialog p { margin: 0 0 12px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom));
    background: #222; color: #fff; padding: 10px 16px; border-radius: 99px; z-index: 50; font-size: 15px; }
  .photo-btns { display: flex; gap: 8px; }
  .photo-btns label { flex: 1; text-align: center; }
  .hidden { display: none !important; }
  .warn { background: #fff7e0; border: 1px solid #f1d27a; color: #6b5300; font-size: 14px; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  textarea.copy { font-size: 13px; min-height: 200px; }
  .syncbar { font-size: 14px; padding: 9px 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
  .syncbar.ok { background: #e5f5ee; color: #17694a; }
  .syncbar.busy { background: #eef1f5; color: #4b5563; }
  .syncbar.offline { background: #eef1f5; color: #4b5563; }
  .syncbar.login, .syncbar.error { background: #fff7e0; color: #6b5300; border: 1px solid #f1d27a; font-weight: 600; }
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div id="fabWrap"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileLib" accept="image/*" class="hidden">
<input type="file" id="fileImport" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ============ Data og lagring ============ */
let data = { sager: [] };
let view = { name: 'home', sagId: null };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const store = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('opmaaling', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('fotos')) db.createObjectStore('fotos');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get() {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => {
        const t = db.transaction('kv').objectStore('kv').get('data');
        t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
      });
    } catch (e) {
      try { return JSON.parse(localStorage.getItem('opmaaling') || 'null'); } catch (e2) { return null; }
    }
  },
  async set(v) {
    try {
      const db = await this.open();
      await new Promise((res, rej) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, 'data');
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch (e) {
      try { localStorage.setItem('opmaaling', JSON.stringify(v)); }
      catch (e2) { toast('Kunne ikke gemme – tag en backup'); }
    }
  }
};
let saveTimer = null;
function save(skipSync) {
  clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set(data), 150);
  if (!skipSync) scheduleSync(2500);
}
const touch = s => { s.updated = Date.now(); };
const liveSager = () => data.sager.filter(s => !s.deleted);

/* Fotos gemmes for sig selv (nøgle = foto-id, værdi = data-URL) */
const fotoMem = new Map();
async function fotoTx(mode, fn) {
  const db = await store.open();
  return new Promise((res, rej) => {
    const tx = db.transaction('fotos', mode); const st = tx.objectStore('fotos');
    let out; const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
  });
}
async function fotoURL(id) {
  if (!id) return null;
  if (fotoMem.has(id)) return fotoMem.get(id);
  try { const u = await fotoTx('readonly', st => st.get(id)); if (u) fotoMem.set(id, u); return u || null; }
  catch (e) { return null; }
}
async function fotoPut(id, url) {
  fotoMem.set(id, url);
  try { await fotoTx('readwrite', st => st.put(url, id)); } catch (e) { /* kun i hukommelsen */ }
}
async function fotoKeys() {
  try { return new Set(await fotoTx('readonly', st => st.getAllKeys())); } catch (e) { return new Set(fotoMem.keys()); }
}
// Ældre data havde billedet direkte i positionen – flyt det til foto-lageret
// Ældre opmålinger (uden sagsnummer) bliver til en sag med én adresse
function normalizeSag(sg) {
  if (!sg || sg.deleted) { if (sg) { sg.adresser = sg.adresser || []; sg.pos = []; } return sg; }
  if (!Array.isArray(sg.adresser)) {
    sg.adresser = [{ id: sg.id + 'a', adresse: sg.navn || 'Adresse', pos: Array.isArray(sg.pos) ? sg.pos : [] }];
    sg.nr = sg.nr || sg.navn || ''; sg.navn = '';
  }
  for (const a of sg.adresser) if (!Array.isArray(a.pos)) a.pos = [];
  sg.pos = []; // bevares tom for kompatibilitet med ældre server
  return sg;
}
const allPos = sg => (sg.adresser || []).flatMap(a => a.pos || []);
async function migrateFotos(list) {
  let changed = false;
  list.forEach(normalizeSag);
  for (const sg of list) for (const p of allPos(sg)) {
    if (p.foto && !p.fotoId) { const id = uid(); await fotoPut(id, p.foto); p.fotoId = id; changed = true; }
    if ('foto' in p) { delete p.foto; changed = true; }
  }
  for (const sg of list) if (!sg.updated) { sg.updated = sg.oprettet || Date.now(); changed = true; }
  return changed;
}

const sag = () => data.sager.find(s => s.id === view.sagId && !s.deleted);
const totalsP = list => {
  let v = 0, g = 0;
  for (const p of list) (p.type === 'glas' ? (g += p.antal || 0) : (v += p.antal || 0));
  return { v, g };
};
const totals = s => totalsP(allPos(s));
const fmtMM = n => (n || n === 0) && n !== '' ? String(Math.round(Number(n))) : '–';

/* ============ Små dialoger (i stedet for alert/confirm) ============ */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function dialog({ text, input, value = '', ok = 'OK', cancel = 'Annuller', danger = false }) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'dialog-bg';
    bg.innerHTML = `<div class="dialog"><p>${esc(text)}</p>
      ${input ? `<input type="text" id="dlgIn" value="${esc(value)}" placeholder="${esc(input)}">` : ''}
      <div class="btns" style="margin-top:14px">
        ${cancel ? `<button class="btn sec" id="dlgNo">${esc(cancel)}</button>` : ''}
        <button class="btn ${danger ? 'danger' : ''}" id="dlgOk">${esc(ok)}</button></div></div>`;
    document.body.appendChild(bg);
    const inp = bg.querySelector('#dlgIn');
    if (inp) { setTimeout(() => inp.focus(), 50); inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(true); }); }
    function done(yes) { bg.remove(); resolve(yes ? (inp ? inp.value.trim() : true) : null); }
    bg.querySelector('#dlgOk').onclick = () => done(true);
    const no = bg.querySelector('#dlgNo'); if (no) no.onclick = () => done(false);
  });
}

/* ============ Foto: indlæs og formindsk ============ */
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function fileToDataURL(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const max = 1400, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.75);
  } finally { URL.revokeObjectURL(url); }
}

/* ============ Skitse ud fra billedet ============ */
const imgCache = new Map();
async function photoImg(src) {
  if (!imgCache.has(src)) imgCache.set(src, loadImage(src));
  return imgCache.get(src);
}
// Laver en blyantstegning (kantdetektion) af billedet
function edgeSketch(img, maxSide, crop) {
  const cr = crop || { x: 0, y: 0, w: 1, h: 1 };
  const sx = cr.x * img.naturalWidth, sy = cr.y * img.naturalHeight;
  const sw = Math.max(4, cr.w * img.naturalWidth), sh = Math.max(4, cr.h * img.naturalHeight);
  const sc = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(3, Math.round(sw * sc)), h = Math.max(3, Math.round(sh * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  const id = x.getImageData(0, 0, w, h), d = id.data, n = w * h;
  const g = new Float32Array(n), b = new Float32Array(n), m = new Float32Array(n);
  for (let i = 0; i < n; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  // let udglatning (3x3)
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    let s = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += g[(y + dy) * w + xx + dx];
    b[y * w + xx] = s / 9;
  }
  // Sobel
  const hist = [];
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx;
    const gx = -b[i - w - 1] - 2 * b[i - 1] - b[i + w - 1] + b[i - w + 1] + 2 * b[i + 1] + b[i + w + 1];
    const gy = -b[i - w - 1] - 2 * b[i - w] - b[i - w + 1] + b[i + w - 1] + 2 * b[i + w] + b[i + w + 1];
    m[i] = Math.sqrt(gx * gx + gy * gy);
    if ((i & 7) === 0) hist.push(m[i]);
  }
  hist.sort((a, c2) => a - c2);
  const p = Math.max(20, hist[Math.floor(hist.length * 0.93)] || 60);
  for (let i = 0; i < n; i++) {
    let v = Math.min(1, m[i] / p); v = Math.pow(v, 1.3);
    const val = 255 - Math.round(v * 225);
    d[i * 4] = val - Math.round(v * 40); d[i * 4 + 1] = val - Math.round(v * 20); d[i * 4 + 2] = val; d[i * 4 + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  return c;
}
// Ren tegning af vinduet: karm, poster/sprosser og ruder – i forholdet bredde/højde
function plainDrawing(p, maxSide) {
  const B = +p.b || 1000, H = +p.h || 1200;
  const r = Math.max(0.25, Math.min(4, H / B));
  let w = maxSide, h = Math.round(maxSide * r);
  if (h > maxSide) { h = maxSide; w = Math.round(maxSide / r); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const lw = Math.max(2, maxSide / 160);
  const glas = p.type === 'glas';
  const f = glas ? 0 : Math.max(6, Math.min(w, h) * 0.06);    // karmbredde
  const t = Math.max(5, Math.min(w, h) * 0.035);                // post/sprosse
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  if (!glas) { x.fillStyle = '#e6ebf2'; x.fillRect(0, 0, w, h); }
  const L = p.lines || { v: [], h: [] };
  const cuts = (arr, len) => {
    const out = [[f, null]];
    for (const pos of [...arr].sort((a, b) => a - b)) { const m = pos * len; out[out.length - 1][1] = m - t / 2; out.push([m + t / 2, null]); }
    out[out.length - 1][1] = len - f; return out.filter(([a, b]) => b - a > 2);
  };
  const xs = cuts(L.v || [], w), ys = cuts(L.h || [], h);
  x.lineWidth = lw; x.strokeStyle = '#2a3b55';
  for (const [x0, x1] of xs) for (const [y0, y1] of ys) {
    x.fillStyle = p.raa ? '#eef0f4' : '#f4f9ff'; x.fillRect(x0, y0, x1 - x0, y1 - y0);
    x.strokeRect(x0, y0, x1 - x0, y1 - y0);
    // lille glans-markering i hver rude
    x.save(); x.strokeStyle = '#a9c4e3'; x.lineWidth = lw * 0.6; x.beginPath();
    const gw = x1 - x0, gh = y1 - y0;
    x.moveTo(x0 + gw * .18, y0 + gh * .32); x.lineTo(x0 + gw * .38, y0 + gh * .14);
    x.moveTo(x0 + gw * .22, y0 + gh * .46); x.lineTo(x0 + gw * .52, y0 + gh * .2); x.stroke(); x.restore();
  }
  x.strokeRect(lw / 2, lw / 2, w - lw, h - lw);
  return c;
}

// Find lodrette og vandrette poster/sprosser i fotoet (inden for den markerede ramme)
function detectLines(img, crop) {
  const cr = crop || { x: 0, y: 0, w: 1, h: 1 };
  const sx = cr.x * img.naturalWidth, sy = cr.y * img.naturalHeight, sw = cr.w * img.naturalWidth, sh = cr.h * img.naturalHeight;
  const sc = Math.min(1, 360 / Math.max(sw, sh));
  const w = Math.max(20, Math.round(sw * sc)), h = Math.max(20, Math.round(sh * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data, n = w * h, g = new Float32Array(n), b = new Float32Array(n);
  for (let i = 0; i < n; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    let s = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += g[(y + dy) * w + xx + dx]; b[y * w + xx] = s / 9;
  }
  const col = new Float32Array(w), row = new Float32Array(h);
  for (let y = 2; y < h - 2; y++) for (let xx = 2; xx < w - 2; xx++) {
    const i = y * w + xx;
    const gx = -b[i - w - 1] - 2 * b[i - 1] - b[i + w - 1] + b[i - w + 1] + 2 * b[i + 1] + b[i + w + 1];
    const gy = -b[i - w - 1] - 2 * b[i - w] - b[i - w + 1] + b[i + w - 1] + 2 * b[i + w] + b[i + w + 1];
    const ax = Math.abs(gx), ay = Math.abs(gy);

    const a = arr.map(v => v / span), sm = new Float32Array(len);
    for (let i = 2; i < len - 2; i++) sm[i] = (a[i - 2] + a[i - 1] + a[i] + a[i + 1] + a[i + 2]) / 5;
    const m0 = Math.round(len * 0.08), m1 = len - m0, vals = [];
    for (let i = m0; i < m1; i++) vals.push(sm[i]);
    if (!vals.length) return [];
    const mean = vals.reduce((s, v) => s + v, 0) / vals.length;
    const sd = Math.sqrt(vals.reduce((s, v) => s + (v - mean) ** 2, 0) / vals.length);
    const max = Math.max(...vals), thr = Math.max(mean + 2.2 * sd, max * 0.45);
    const raw = [];
    for (let i = m0; i < m1; i++) if (sm[i] >= thr && sm[i] >= sm[i - 1] && sm[i] >= sm[i + 1]) raw.push(i);

    const groups = [];
    for (const i of raw) { const gr = groups[groups.length - 1]; if (gr && i - gr[gr.length - 1] <= len * 0.07) gr.push(i); else groups.push([i]); }

      .map(v => Math.round(v * 1000) / 1000).slice(0, 4);
  };
  return { v: peaks(col, w, h), h: peaks(row, h, w) };
}

      <div style="text-align:center;font-size:14px;color:#bbb;margin-bottom:10px">Træk i de gule linjer, så de ligger på poster og sprosser. Tryk på en linje for at vælge den.</div>
      <div id="lWrap" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0">
        <div id="lBox" style="position:relative;touch-action:none;user-select:none;-webkit-user-select:none"><canvas id="lCv" style="display:block"></canvas></div>
      </div>
      <div class="btns" style="margin-top:10px"><button class="btn sec small" id="lAddV">+ Lodret</button><button class="btn sec small" id="lAddH">+ Vandret</button><button class="btn danger small" id="lDel">Fjern valgt</button></div>
      <div class="btns"><button class="btn sec small" id="lAuto" ${img ? '' : 'disabled'}>Find automatisk</button><button class="btn sec small" id="lClear">Ingen linjer</button></div>
      <div class="btns"><button class="btn sec" id="lNo">Annuller</button><button class="btn" id="lOk">Færdig</button></div>
    </div>`;
    document.body.appendChild(bg);
    const box = bg.querySelector('#lBox'), cv = bg.querySelector('#lCv'), wrap = bg.querySelector('#lWrap');
    let W = 0, H = 0, sel = null;
    const aspect = () => {
      if (img) { const cr = p.crop || { w: 1, h: 1 }; return (cr.h * img.naturalHeight) / (cr.w * img.naturalWidth); }
      return (+p.h || 1200) / (+p.b || 1000);
    };
    function layout() {
      const r = aspect(); const mw = wrap.clientWidth, mh = wrap.clientHeight;
      W = Math.min(mw, mh / r); H = W * r;
      cv.width = Math.round(W * 2); cv.height = Math.round(H * 2); cv.style.width = W + 'px'; cv.style.height = H + 'px';
      const x = cv.getContext('2d');
      if (img) { const cr = p.crop || { x: 0, y: 0, w: 1, h: 1 };
        x.drawImage(img, cr.x * img.naturalWidth, cr.y * img.naturalHeight, cr.w * img.naturalWidth, cr.h * img.naturalHeight, 0, 0, cv.width, cv.height); }
      else { x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); }
      draw();
    }
    function draw() {
      box.querySelectorAll('.ln').forEach(e => e.remove());
      for (const k of ['v', 'h']) L[k].forEach((pos, i) => {
        const el = document.createElement('div'); el.className = 'ln'; el.dataset.k = k; el.dataset.i = i;
        const on = sel && sel.k === k && sel.i === i, col = on ? '#ff4d4d' : '#ffcc00';
        el.style.cssText = k === 'v'
          ? `position:absolute;top:0;height:100%;width:36px;left:${pos * W - 18}px;display:flex;justify-content:center;touch-action:none`
          : `position:absolute;left:0;width:100%;height:36px;top:${pos * H - 18}px;display:flex;align-items:center;touch-action:none`;
        el.innerHTML = `<div style="background:${col};${k === 'v' ? 'width:4px;height:100%' : 'height:4px;width:100%'};box-shadow:0 0 3px #000"></div>`;
        box.appendChild(el);
      });
      bg.querySelector('#lDel').disabled = !sel;
    }
    let drag = null;
    box.addEventListener('pointerdown', e => {
      const el = e.target.closest('.ln'); if (!el) { sel = null; draw(); return; }
      sel = { k: el.dataset.k, i: +el.dataset.i }; drag = sel; box.setPointerCapture(e.pointerId); e.preventDefault(); draw();
    });
    box.addEventListener('pointermove', e => {
      if (!drag) return;
      const r = box.getBoundingClientRect();
      const v = drag.k === 'v' ? (e.clientX - r.left) / r.width : (e.clientY - r.top) / r.height;
      L[drag.k][drag.i] = Math.round(Math.min(0.97, Math.max(0.03, v)) * 1000) / 1000; draw();
    });
    const end = () => { drag = null; };
    box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
    const addLine = k => {
      const pts = [0, ...L[k].slice().sort((a, b) => a - b), 1]; let best = 0.5, gap = 0;
      for (let i = 0; i < pts.length - 1; i++) if (pts[i + 1] - pts[i] > gap) { gap = pts[i + 1] - pts[i]; best = (pts[i] + pts[i + 1]) / 2; }
      L[k].push(Math.round(best * 1000) / 1000); sel = { k, i: L[k].length - 1 }; draw();
    };
    bg.querySelector('#lAddV').onclick = () => addLine('v');
    bg.querySelector('#lAddH').onclick = () => addLine('h');
    bg.querySelector('#lDel').onclick = () => { if (sel) { L[sel.k].splice(sel.i, 1); sel = null; draw(); } };
    bg.querySelector('#lClear').onclick = () => { L = { v: [], h: [] }; sel = null; draw(); };
    bg.querySelector('#lAuto').onclick = () => { if (img) { L = detectLines(img, p.crop); sel = null; draw(); toast(`Fandt ${L.v.length + L.h.length} linjer`); } };
    window.addEventListener('resize', layout);
    const done = v => { window.removeEventListener('resize', layout); bg.remove(); resolve(v); };
    bg.querySelector('#lNo').onclick = () => done(null);
    bg.querySelector('#lOk').onclick = () => done({ v: L.v.slice().sort((a, b) => a - b), h: L.h.slice().sort((a, b) => a - b) });
    requestAnimationFrame(layout);
  });
}
// Samler billede/tegning med målpile og tekst
async function makeSketch(p, maxSide = 700) {
  let body = null;
  const fu = p.fotoId ? await fotoURL(p.fotoId) : null;
  // Foto-skitse kun når det er valgt (eller for ældre positioner uden tegning)
  const fotoMode = fu && (p.visning === 'foto' || (!p.visning && !p.lines));
  if (fotoMode) { try { body = edgeSketch(await photoImg(fu), maxSide, p.crop); } catch (e) { body = null; } }
  if (!body) body = plainDrawing(p, Math.round(maxSide * 0.75));
  const u = Math.max(body.width, body.height) / 700; // skala for tekst
  const fs = Math.round(Math.max(13, 30 * Math.max(u, 0.55)));
  const padL = Math.round(fs * 0.8), padT = Math.round(fs * 2.2), padB = Math.round(fs * (2.6 + 1.3 * sketchExtra(p).length));
  const ctxMeasure = document.createElement('canvas').getContext('2d');
  ctxMeasure.font = `600 ${fs}px -apple-system, Helvetica, Arial, sans-serif`;
  const hTxt = `${fmtMM(p.h)} mm`;
  const padR = Math.round(ctxMeasure.measureText(hTxt).width + fs * 2);
  const W = body.width + padL + padR, H = body.height + padT + padB;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.drawImage(body, padL, padT);
  // titel
  x.fillStyle = '#1b1f24'; x.font = `700 ${fs}px -apple-system, Helvetica, Arial, sans-serif`; x.textBaseline = 'middle';
  const t = `Pos. ${p.nr}${p.rum ? ' – ' + p.rum : ''}`;
  x.fillText(t, padL, padT / 2);
  const typeTxt = `${p.type === 'glas' ? 'Glas' : 'Vindue'}${p.ventil ? ' · ventil' : ''}${p.raa ? ' · råglas' : ''} · ${p.antal || 1} stk`;
  x.font = `500 ${Math.round(fs * 0.8)}px -apple-system, Helvetica, Arial, sans-serif`; x.fillStyle = '#6b7280';
  x.textAlign = 'right'; x.fillText(typeTxt, W - fs * 0.5, padT / 2); x.textAlign = 'left';
  // målpile
  const col = '#c0392b'; x.strokeStyle = col; x.fillStyle = col; x.lineWidth = Math.max(2, fs / 10);
  const a = fs * 0.45;
  const arrow = (x1, y1, x2, y2) => {
    x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke();
    const ang = Math.atan2(y2 - y1, x2 - x1);
    for (const [px, py, an] of [[x1, y1, ang + Math.PI], [x2, y2, ang]]) {
      x.beginPath(); x.moveTo(px, py);
      x.lineTo(px - a * Math.cos(an - 0.4), py - a * Math.sin(an - 0.4));
      x.lineTo(px - a * Math.cos(an + 0.4), py - a * Math.sin(an + 0.4)); x.closePath(); x.fill();
    }
  };
  const L = padL, R = padL + body.width, T = padT, Bt = padT + body.height;
  const sd = harTil(p) ? (p.tilSider || []) : [], all = sd.includes('rundt');
  if (sd.length) {
    const tw = Math.max(5, fs * 0.32); x.fillStyle = 'rgba(30,142,90,.85)';
    if (all || sd.includes('venstre')) x.fillRect(L, T, tw, Bt - T);
    if (all || sd.includes('hoejre')) x.fillRect(R - tw, T, tw, Bt - T);
    if (all || sd.includes('top')) x.fillRect(L, T, R - L, tw);
    if (all) x.fillRect(L, Bt - tw, R - L, tw);
  }
  x.fillStyle = col;
  const yb = Bt + fs * 0.9;
  x.setLineDash([4, 4]); x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(L, Bt); x.lineTo(L, yb + fs * .3); x.moveTo(R, Bt); x.lineTo(R, yb + fs * .3);
  const xr = R + fs * 0.9;
  x.moveTo(R, T); x.lineTo(xr + fs * .3, T); x.moveTo(R, Bt); x.lineTo(xr + fs * .3, Bt); x.stroke(); x.setLineDash([]);
  x.lineWidth = Math.max(2, fs / 10);
  arrow(L, yb, R, yb);
  arrow(xr, T, xr, Bt);
  x.font = `700 ${fs}px -apple-system, Helvetica, Arial, sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'top';
  x.fillText(`B ${fmtMM(p.b)} mm`, (L + R) / 2, yb + fs * 0.35);
  x.textAlign = 'left'; x.textBaseline = 'middle';
  x.save(); x.fillText('H', xr + fs * 0.35, (T + Bt) / 2 - fs * 0.6); x.fillText(hTxt, xr + fs * 0.35, (T + Bt) / 2 + fs * 0.6); x.restore();
  const extra = sketchExtra(p);
  const maxW = W - padL * 2;
  const fit = t => { if (x.measureText(t).width <= maxW) return t; while (t.length > 3 && x.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; };
  x.font = `600 ${Math.round(fs * 0.8)}px -apple-system, Helvetica, Arial, sans-serif`;
  x.textAlign = 'left'; x.textBaseline = 'middle';
  extra.reverse().forEach(([col, t], i) => { x.fillStyle = col; x.fillText(fit(t), padL, H - fs * 0.75 - i * fs * 1.3); });
  return c;
}

async function thumbURL(p) {
  const key = [p.id, p.b, p.h, p.antal, p.type, p.kd, p.kt, harTil(p) ? 1 : 0, (p.tilSider || []).join(), harPlade(p) ? 1 : 0, farveTxt(p).join(), p.ventil ? 1 : 0, p.raa ? 1 : 0, p.rum, p.nr, p.fotoId || '', fotoMem.has(p.fotoId) ? 1 : 0, p.crop ? JSON.stringify(p.crop) : '', JSON.stringify(p.lines || ''), p.visning || ''].join('|');

}

function menuSheet(title, items) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><h2>${esc(title)}</h2>${items.map(([, label, cls], i) =>
    `<button class="btn ${cls || 'sec'}" data-i="${i}" style="margin:8px 0">${esc(label)}</button>`).join('')}
    <button class="btn" id="mClose" style="margin-top:14px">Luk</button></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector('#mClose').onclick = close;
  bg.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { close(); items[+b.dataset.i][0](); });
}

function adrMenu(s, a) {

function formDialog(title, fields, ok) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'dialog-bg';
    bg.innerHTML = `<div class="dialog"><p><b>${esc(title)}</b></p>${fields.map(([label, value, ph, mode], i) =>
      `<label class="f" style="margin-top:${i ? 10 : 0}px">${esc(label)}</label><input type="text" data-f="${i}" value="${esc(value)}" placeholder="${esc(ph || '')}" ${mode ? `inputmode="${mode === 'numeric' ? 'text' : mode}"` : ''}>`).join('')}
      <div class="btns" style="margin-top:14px"><button class="btn sec" id="fNo">Annuller</button><button class="btn" id="fOk">${esc(ok)}</button></div></div>`;
    document.body.appendChild(bg);
    const ins = [...bg.querySelectorAll('[data-f]')];
    setTimeout(() => ins[0].focus(), 50);
    const done = v => { bg.remove(); resolve(v); };
    ins.forEach((el, i) => el.addEventListener('keydown', e => { if (e.key === 'Enter') { if (ins[i + 1]) ins[i + 1].focus(); else done(ins.map(x => x.value.trim())); } }));
    bg.querySelector('#fOk').onclick = () => done(ins.map(x => x.value.trim()));
    bg.querySelector('#fNo').onclick = () => done(null);
  });
}

const karmTxt = p => (p.kd || p.kt) ? 'Karm: ' + [p.kd ? 'dybde ' + fmtMM(p.kd) : '', p.kt ? 'tykkelse ' + fmtMM(p.kt) : ''].filter(Boolean).join(' × ') + ' mm' : '';

const SIDER = [['venstre', 'Venstre'], ['hoejre', 'Højre'], ['top', 'Top'], ['rundt', 'Hele vejen rundt']];
const siderTxt = p => {
  const v = p.tilSider || [];
  if (v.includes('rundt')) return 'hele vejen rundt';
  return SIDER.filter(([k]) => v.includes(k)).map(([, n]) => n.toLowerCase()).join(', ');
};
const harTil = p => p.til !== undefined ? !!p.til : !!((p.tilSider && p.tilSider.length) || p.tilNote);
const harPlade = p => p.plade !== undefined ? !!p.plade : !!p.pladeNote;
const tilTxt = p => harTil(p) ? 'Tilsætning' + (siderTxt(p) ? ': ' + siderTxt(p) : '') : '';
const pladeTxt = p => harPlade(p) ? 'Vindueplade' : '';
const farveDel = (navn, k, r, ens) => {
  if (!k && !r) return '';
  if (ens || !r || k === r) return `Farve ${navn}: ${k || r}`;
  return `Farve ${navn}: karm ${k || '–'}, ramme ${r}`;
};
const farveTxt = p => [farveDel('ude', p.fuK, p.fuR, p.fuEns !== false), farveDel('inde', p.fiK, p.fiR, p.fiEns !== false)].filter(Boolean);
const FARVER = ['Hvid', 'Hvid RAL 9010', 'Grå RAL 7035', 'Hvid RAL 9016', 'Cremehvid RAL 9001', 'Antracitgrå RAL 7016', 'Sort RAL 9005', 'Rå træ', 'Teak', 'Mahogni'];
const sketchExtra = p => {
  const a = [];
  if (karmTxt(p)) a.push(['#1b1f24', karmTxt(p)]);
  for (const f of farveTxt(p)) a.push(['#1b1f24', f]);
  if (tilTxt(p)) a.push(['#17694a', tilTxt(p)]);
  if (pladeTxt(p)) a.push(['#1b1f24', pladeTxt(p)]);
  if (p.raa) a.push(['#4c3a99', 'Råglas: ' + (p.raaType || 'type ikke valgt')]);
  return a;
};

/* ============ Råglas-typer (Fynbo Glas ornamentliste) ============ */
const RAAGLAS = [
  '4 mm Gross Artic', '4 mm Small Artic', '4 mm Gross Kathedral', '4 mm Klein Kathedral', '4 mm Ornament 520',
  '4 mm Chincilla', '4 mm Ornament 504', '4 mm Pacific', '4 mm Silvit', '4 mm Cotswold', '4 mm Barroch',
  '4 mm Ornament 597', '4 mm Abstrach', '6 mm Spejtråd', '7 mm Treclar Tråd', '7 mm Georgian Tråd',
  '4 mm Satimat', '6 mm Antelio Silver', '6 mm Antelio Klar', '4 mm Grå Parsol'
];
const raaSlug = n => n.toLowerCase().replace(/æ/g, 'ae').replace(/ø/g, 'oe').replace(/å/g, 'aa').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const raaImg = n => `raaglas/${raaSlug(n)}.jpg`;
function raaTiles(selected) {
  const known = RAAGLAS.includes(selected);
  return RAAGLAS.map(n => `<div class="raatile ${n === selected ? 'on' : ''}" data-raa="${esc(n)}">
      <div class="ph"><img src="${raaImg(n)}" alt="" loading="lazy" onerror="this.remove()"></div>${esc(n)}</div>`).join('') +
    `<div class="raatile ${selected && !known ? 'on' : ''}" data-raa="__andet"><div class="ph">✎</div>Anden type</div>`;
}

/* ============ Redigér position ============ */
function parseMM(v) { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) && n > 0 ? Math.round(n) : ''; }

/* ============ Markér vinduet på billedet (beskæring) ============ */
function cropEditor(src, crop) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'dialog-bg'; bg.style.alignItems = 'stretch'; bg.style.padding = '0';
    bg.innerHTML = `<div style="background:#111;color:#fff;width:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))">
      <div style="text-align:center;font-weight:600;margin-bottom:4px">Markér vinduet</div>
      <div style="text-align:center;font-size:14px;color:#bbb;margin-bottom:10px">Træk i hjørnerne, så rammen passer med det, der er målt.</div>
      <div id="cWrap" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0">
        <div id="cBox" style="position:relative;touch-action:none;user-select:none;-webkit-user-select:none">
          <img id="cImg" src="${src}" style="display:block;max-width:100%;max-height:100%;pointer-events:none">
          <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none"><div id="cRect" style="position:absolute;border:2px solid #ffcc00;box-shadow:0 0 0 9999px rgba(0,0,0,.45)"></div></div>
        </div>
      </div>
      <div class="btns" style="margin-top:12px"><button class="btn sec" id="cAll">Hele billedet</button><button class="btn sec" id="cNo">Annuller</button><button class="btn" id="cOk">Færdig</button></div>
    </div>`;
    document.body.appendChild(bg);
    const box = bg.querySelector('#cBox'), img = bg.querySelector('#cImg'), rect = bg.querySelector('#cRect'), wrap = bg.querySelector('#cWrap');
    let r = crop ? { ...crop } : { x: 0.08, y: 0.08, w: 0.84, h: 0.84 };
    const H = 34;
    const handles = ['nw', 'ne', 'sw', 'se'].map(k => {
      const h = document.createElement('div'); h.dataset.k = k;
      h.style.cssText = `position:absolute;width:${H}px;height:${H}px;margin:-${H / 2}px 0 0 -${H / 2}px;border-radius:50%;background:#ffcc00;border:3px solid #fff;touch-action:none`;
      box.appendChild(h); return h;
    });
    const fit = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight; if (!iw) return;
      const s = Math.min(wrap.clientWidth / iw, wrap.clientHeight / ih);
      img.style.width = iw * s + 'px'; img.style.height = ih * s + 'px';
      draw();
    };
    function draw() {
      const W = img.clientWidth, Hh = img.clientHeight;
      Object.assign(rect.style, { left: r.x * W + 'px', top: r.y * Hh + 'px', width: r.w * W + 'px', height: r.h * Hh + 'px' });
      const pos = { nw: [r.x, r.y], ne: [r.x + r.w, r.y], sw: [r.x, r.y + r.h], se: [r.x + r.w, r.y + r.h] };
      handles.forEach(h => { const [a, b] = pos[h.dataset.k]; h.style.left = a * W + 'px'; h.style.top = b * Hh + 'px'; });
    }
    if (img.complete) fit(); else img.onload = fit;
    let drag = null;
    const pt = e => { const b = img.getBoundingClientRect(); return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height]; };
    box.addEventListener('pointerdown', e => {
      const k = e.target.dataset && e.target.dataset.k;
      const [px, py] = pt(e);
      if (k) drag = { k };
      else if (px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h) drag = { k: 'move', ox: px - r.x, oy: py - r.y };
      else return;
      box.setPointerCapture(e.pointerId); e.preventDefault();
    });
    box.addEventListener('pointermove', e => {
      if (!drag) return;
      let [px, py] = pt(e); px = Math.min(1, Math.max(0, px)); py = Math.min(1, Math.max(0, py));
      const min = 0.05; let x1 = r.x, y1 = r.y, x2 = r.x + r.w, y2 = r.y + r.h;
      if (drag.k === 'move') {
        const nx = Math.min(1 - r.w, Math.max(0, px - drag.ox)), ny = Math.min(1 - r.h, Math.max(0, py - drag.oy));
        r.x = nx; r.y = ny; draw(); return;
      }
      if (drag.k.includes('w')) x1 = Math.min(px, x2 - min); else x2 = Math.max(px, x1 + min);
      if (drag.k.includes('n')) y1 = Math.min(py, y2 - min); else y2 = Math.max(py, y1 + min);
      r = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }; draw();
    });
    const end = () => { drag = null; };
    box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
    window.addEventListener('resize', fit);
    const done = v => { window.removeEventListener('resize', fit); bg.remove(); resolve(v); };
    bg.querySelector('#cAll').onclick = () => { r = { x: 0, y: 0, w: 1, h: 1 }; draw(); };
    bg.querySelector('#cNo').onclick = () => done(null);
    bg.querySelector('#cOk').onclick = () => done({ x: +r.x.toFixed(4), y: +r.y.toFixed(4), w: +r.w.toFixed(4), h: +r.h.toFixed(4) });
  });
}

function listText(s, only) {
  const line = p => `Pos. ${p.nr}${p.rum ? ' – ' + p.rum : ''}: B ${fmtMM(p.b)} × H ${fmtMM(p.h)} mm, ${p.antal} stk${karmTxt(p) ? ', ' + karmTxt(p).toLowerCase() : ''}${p.ventil ? ', MED VENTIL' : ''}${p.raa ? ', RÅGLAS' + (p.raaType ? ' (' + p.raaType + ')' : '') : ''}${tilTxt(p) ? ', ' + tilTxt(p) : ''}${pladeTxt(p) ? ', ' + pladeTxt(p) : ''}${farveTxt(p).map(f => ', ' + f).join('')}${p.note ? ' (' + p.note + ')' : ''}`;
  const adrs = only ? [only] : (s.adresser || []).filter(a => a.pos.length);
  let out = `${sagLabel(s)}${s.navn ? ' – ' + s.navn : ''}\n${only ? 'Adresse: ' + only.adresse + '\n' : ''}Dato: ${new Date().toLocaleDateString('da-DK')}\nMål i mm, bredde × højde, målt midt på.\n`;
  if (!only) { const t = totals(s); out += `Hele sagen: ${t.v} vinduer og ${t.g} glas på ${adrs.length} adresse${adrs.length === 1 ? '' : 'r'}\n`; }
  const vent = list => list.filter(p => p.ventil).reduce((n, p) => n + (p.antal || 0), 0);
  const raa = list => list.filter(p => p.raa).reduce((n, p) => n + (p.antal || 0), 0);
  const ventTxt = list => { const a = []; if (vent(list)) a.push(`${vent(list)} med ventil`); if (raa(list)) a.push(`${raa(list)} med råglas`); return a.length ? ` (heraf ${a.join(', ')})` : ''; };
  for (const a of adrs) {
    const v = a.pos.filter(p => p.type !== 'glas'), g = a.pos.filter(p => p.type === 'glas'), t = totalsP(a.pos);
    if (!only) out += `\n===== ${a.adresse} =====\n`;
    if (v.length) out += `\nVINDUER – i alt ${t.v} stk${ventTxt(v)}\n` + v.map(line).join('\n') + '\n';
    if (g.length) out += `\nGLAS – i alt ${t.g} stk${ventTxt(g)}\n` + g.map(line).join('\n') + '\n';
  }
  return out;
}

/* ============ Home Assistant: login og synkronisering ============ */
const HA = location.pathname.startsWith('/opmaaling-app/');
const APP_BASE = location.origin + '/opmaaling-app/';
const CLIENT_ID = APP_BASE;
const REDIRECT_URI = APP_BASE + 'index.html';
let syncState = { status: HA ? 'idle' : 'off', last: +localStorage.getItem('opm_lastSync') || 0, msg: '' };
let syncing = false, syncAgain = false, syncTimer = null, renderPending = false;

const authGet = () => { try { return JSON.parse(localStorage.getItem('opm_auth') || 'null'); } catch (e) { return null; } };
const authSet = a => { try { a ? localStorage.setItem('opm_auth', JSON.stringify(a)) : localStorage.removeItem('opm_auth'); } catch (e) {} };

async function tokenRequest(params) {
  const r = await fetch('/auth/token', { method: 'POST', body: new URLSearchParams(params) });
  if (!r.ok) { const e = new Error('auth ' + r.status); e.status = r.status; throw e; }
  const j = await r.json();
  return { access_token: j.access_token, refresh_token: j.refresh_token || params.refresh_token,
           expires: Date.now() + (j.expires_in || 1800) * 1000, clientId: params.client_id };
}
// Når appen vises i Home Assistants sidemenu, kan den låne den indloggede brugers adgang
async function parentToken() {
  try {
    if (!inFrame) return null;
    const ha = window.parent.document.querySelector('home-assistant');
    const a = ha && ha.hass && ha.hass.auth;
    if (!a) return null;
    if (a.expired) await a.refreshAccessToken();
    return a.accessToken || null;
  } catch (e) { return null; }
}
async function getToken(force) {
  const pt = await parentToken(); if (pt) return pt;
  let a = authGet();
  if (!a) {
    // Er man logget ind i Home Assistant i samme browser, kan det login bruges
    try {
      const h = JSON.parse(localStorage.getItem('hassTokens') || 'null');
      if (h && h.refresh_token && h.clientId) a = { access_token: h.access_token, refresh_token: h.refresh_token, expires: h.expires || 0, clientId: h.clientId, borrowed: true };
    } catch (e) {}
  }
  if (!a) return null;
  if (!force && a.access_token && a.expires > Date.now() + 30000) return a.access_token;
  try {
    const n = await tokenRequest({ grant_type: 'refresh_token', refresh_token: a.refresh_token, client_id: a.clientId });
    if (!a.borrowed) authSet(n);
    return n.access_token;
  } catch (e) {
    if (e.status === 400 || e.status === 403) { if (!a.borrowed) authSet(null); return null; }
    throw e; // netværksfejl
  }
}
function startLogin() {
  const state = uid();
  try { localStorage.setItem('opm_state', state); } catch (e) {}
  location.href = '/auth/authorize?response_type=code&client_id=' + encodeURIComponent(CLIENT_ID) +
    '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) + '&state=' + encodeURIComponent(state);
}
async function handleLoginReturn() {
  if (!HA) return;
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  if (!code) return;
  history.replaceState(null, '', location.pathname);
  let expected = null; try { expected = localStorage.getItem('opm_state'); localStorage.removeItem('opm_state'); } catch (e) {}
  if (expected && q.get('state') !== expected) { toast('Login mislykkedes – prøv igen'); return; }
  try {
    authSet(await tokenRequest({ grant_type: 'authorization_code', code, client_id: CLIENT_ID }));
    toast('Logget ind');
  } catch (e) { toast('Login mislykkedes – prøv igen'); }
}
async function api(path, opts = {}, retried) {
  const t = await getToken(retried);
  if (!t) { const e = new Error('login'); e.login = true; throw e; }
  const r = await fetch('/api/opmaaling/' + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + t } });
  if (r.status === 401 && !retried) return api(path, opts, true);
  if (r.status === 401) { authSet(null); const e = new Error('login'); e.login = true; throw e; }
  if (r.status === 404 && path === 'sager') { const e = new Error('mangler'); e.missing = true; throw e; }
  return r;
}
async function dataURLtoBlob(u) { return (await fetch(u)).blob(); }
function blobToDataURL(b) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
}

async function sync() {
  if (!HA) return;
  if (syncing) { syncAgain = true; return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  syncing = true; setSync('busy');
  let changedLocal = false;
  try {
    const remote = await (await api('sager')).json();
    const rmap = new Map(remote.map(r => [r.id, r]));
    // Hent nyere sager fra Home Assistant
    for (const r of remote) {
      const local = data.sager.find(s => s.id === r.id);
      if (!local || (r.updated || 0) > (local.updated || 0)) {
        const res = await api('sager/' + encodeURIComponent(r.id));
        if (!res.ok) continue;
        const sg = normalizeSag(await res.json());
        const i = data.sager.findIndex(s => s.id === sg.id);
        if (i >= 0) data.sager[i] = sg; else data.sager.push(sg);
        changedLocal = true;
      }
    }
    // Send nyere sager til Home Assistant
    for (const sg of data.sager) {
      const r = rmap.get(sg.id);
      if (!r || (sg.updated || 0) > (r.updated || 0)) {
        const res = await api('sager/' + encodeURIComponent(sg.id), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sg) });
        if (res.status === 409) {
          const j = await res.json(); const i = data.sager.findIndex(s => s.id === sg.id);
          if (j.sag && i >= 0) { data.sager[i] = normalizeSag(j.sag); changedLocal = true; }
        } else if (!res.ok) throw new Error('put ' + res.status);
      }
    }
    if (changedLocal) save(true);
    // Billeder: send dem, der mangler i HA, og hent dem, der mangler her
    const rf = new Set(await (await api('fotos')).json());
    const lf = await fotoKeys();
    const used = new Set(); for (const sg of liveSager()) for (const p of allPos(sg)) if (p.fotoId) used.add(p.fotoId);
    for (const id of used) {
      if ((lf.has(id) || fotoMem.has(id)) && !rf.has(id)) {
        const u = await fotoURL(id); if (!u) continue;
        const res = await api('fotos/' + encodeURIComponent(id), { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: await dataURLtoBlob(u) });
        if (!res.ok) throw new Error('foto ' + res.status);
      } else if (!lf.has(id) && !fotoMem.has(id) && rf.has(id)) {
        const res = await api('fotos/' + encodeURIComponent(id));
        if (res.ok) { await fotoPut(id, await blobToDataURL(await res.blob())); changedLocal = true; }
      }
    }
    syncState.last = Date.now(); try { localStorage.setItem('opm_lastSync', String(syncState.last)); } catch (e) {}
    setSync('ok');
  } catch (e) {
    if (e.login) setSync('login');
    else if (e.missing) setSync('error', 'Integrationen svarer ikke i Home Assistant');
    else setSync(navigator.onLine ? 'error' : 'offline', navigator.onLine ? 'Kunne ikke synkronisere' : '');
  } finally {
    syncing = false;
    if (changedLocal) rerenderSoon();
    if (syncAgain) { syncAgain = false; scheduleSync(500); }
  }
}
function rerenderSoon() {
  // Rør ikke skærmen, mens man er i gang med at redigere
  if (document.querySelector('.sheet-bg, .dialog-bg')) { renderPending = true; return; }
  if (view.name === 'sag' && !sag()) view = { name: 'home' };
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
setInterval(() => { if (renderPending && !document.querySelector('.sheet-bg, .dialog-bg')) { renderPending = false; rerenderSoon(); } }, 1000);
function scheduleSync(ms) { if (!HA) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
function startSync() {
  if (!HA) return;
  sync();
  window.addEventListener('online', () => scheduleSync(500));
  window.addEventListener('offline', () => setSync('offline'));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(300); });
  setInterval(() => { if (!document.hidden) sync(); }, 60000);
}
function syncText() {
  const t = syncState.last ? new Date(syncState.last).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' }) : '';
  switch (syncState.status) {
    case 'busy': return ['busy', 'Synkroniserer …'];
    case 'ok': return ['ok', 'Synkroniseret med Home Assistant ' + t];
    case 'login': return ['login', 'Ikke logget ind – tryk her for at logge ind i Home Assistant'];
    case 'offline': return ['offline', 'Ingen forbindelse – gemmes på telefonen og synkroniseres senere'];
    case 'error': return ['error', (syncState.msg || 'Kunne ikke synkronisere') + ' – tryk for at prøve igen'];
    default: return ['busy', 'Forbinder …'];
  }
}
function syncBarHTML() {
  if (!HA) return '';
  const [cls, txt] = syncText();
  return `<div id="syncBar" class="syncbar ${cls}">${esc(txt)}</div>`;
}
function setSync(status, msg = '') {
  syncState.status = status; syncState.msg = msg;
  const el = document.getElementById('syncBar');
  if (el) { const [cls, txt] = syncText(); el.className = 'syncbar ' + cls; el.textContent = txt; }
}
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'syncBar') { syncState.status === 'login' ? startLogin() : sync(); }
});

/* ============ Start ============ */
let inFrame = false;
try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
const onClaude = /claude/i.test(location.hostname);
(async () => {
  const d = await store.get();
  if (d && Array.isArray(d.sager)) data = d;
  if (await migrateFotos(data.sager)) save(true);
  await handleLoginReturn();
  render();
  startSync();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && !onClaude && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
